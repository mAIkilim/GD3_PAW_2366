<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Form Pendaftaran Mahasiswa</h1>

    <nav>
        <a href="profil.html"
           onclick="return confirm('Yakin ingin kembali ke Halaman Profil?')">
            Halaman Profil
        </a>

        <a href="interaktif.html"
           onclick="return confirm('Yakin ingin membuka Halaman Interaktif?')">
            Halaman Interaktif
        </a>
    </nav>

    <h2>Silakan Isi Data Pendaftaran</h2>

    <form action="#" method="get">

        <label for="nama">Nama Lengkap:</label>
        <br>

        <input
            type="text"
            id="nama"
            name="nama"
            placeholder="Masukkan nama lengkap"
            required
        >

        <br><br>

        <label>Jenis Kelamin:</label>
        <br>

        <input
            type="radio"
            id="laki"
            name="jenis_kelamin"
            value="Laki-laki"
            required
        >

        <label for="laki">Laki-laki</label>

        <br>

        <input
            type="radio"
            id="perempuan"
            name="jenis_kelamin"
            value="Perempuan"
        >

        <label for="perempuan">Perempuan</label>

        <br><br>

        <label for="prodi">Program Studi:</label>
        <br>

        <select id="prodi" name="prodi" required>
            <option value="">-- Pilih Program Studi --</option>
            <option value="Informatika">Informatika</option>
            <option value="Sistem Informasi">Sistem Informasi</option>
            <option value="Teknik Industri">Teknik Industri</option>
        </select>

        <br><br>

        <label for="email">Email:</label>
        <br>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="contoh@email.com"
            required
        >

        <br><br>

        <label for="alasan">Alasan Mendaftar:</label>
        <br>

        <textarea
            id="alasan"
            name="alasan"
            rows="5"
            cols="40"
            placeholder="Tuliskan alasan mendaftar"
        ></textarea>

        <br><br>

        <button type="submit">Daftar Sekarang</button>

    </form>

</body>
</html>
