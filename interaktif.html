<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Interaktif</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 id="judulHalaman">Halaman Interaktif Saya</h1>

    <nav>
        <a href="profil.html"
           onclick="return confirm('Yakin ingin membuka Halaman Profil?')">
            Halaman Profil
        </a>

        <a href="form.html"
           onclick="return confirm('Yakin ingin membuka Form Pendaftaran?')">
            Form Pendaftaran
        </a>
    </nav>

    <h2>Latihan JavaScript Console</h2>

    <p>
        Tekan F12 dan buka tab Console
        untuk melihat hasil JavaScript.
    </p>

    <h2>Manipulasi Teks dengan Event</h2>

    <p id="teks">Teks ini bisa berubah!</p>

    <button onclick="ubahBiru()">
        Ubah ke Biru
    </button>

    <h2>Latihan Dialog Box</h2>

    <label for="inputNama">Masukkan Nama:</label>

    <input
        type="text"
        id="inputNama"
        placeholder="Masukkan nama Anda"
    >

    <button onclick="tampilkanNama()">
        Tampilkan
    </button>

    <h2>Kalkulator Kuadrat</h2>

    <label for="inputAngka">Masukkan Angka:</label>

    <input
        type="number"
        id="inputAngka"
        placeholder="Masukkan angka"
    >

    <button onclick="hitungKuadrat()">
        Hitung
    </button>

    <p id="hasilKuadrat"></p>

    <script>

        console.log("Halo dari JavaScript!");

        const angka = 5 * 4;
        console.log(angka);

        const judul = document.getElementById("judulHalaman");

        judul.style.color = "red";

        console.log(judul.innerHTML);

        function sapa(nama) {
            return "Halo, " + nama + "!";
        }

        console.log(sapa("Sonik"));

        function ubahBiru() {
            const teks = document.getElementById("teks");
            teks.style.color = "blue";
        }

        function tampilkanNama() {
            const nama = document.getElementById("inputNama").value;

            if (nama.trim() === "") {
                alert("Silakan isi nama dulu.");
            } else {
                alert("Halo, " + nama + "!");
            }
        }

        function hitungKuadrat() {
            const input = document.getElementById("inputAngka").value;

            if (input.trim() === "") {
                alert("Silakan masukkan angka terlebih dahulu!");
                return;
            }

            const angka = Number(input);
            const hasil = angka * angka;

            document.getElementById("hasilKuadrat").textContent =
                "Hasil kuadrat: " + hasil;
        }

    </script>

</body>
</html>
